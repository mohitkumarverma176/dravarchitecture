services:
  drav:
    build: .
    container_name: drav_architecture
    restart: always
    ports:
      - "127.0.0.1:5000:5000"   # bind only to localhost — nginx proxies from outside
    env_file:
      - .env
    mem_limit: 512m        # hard cap — prevents OOM-killing the host OS on 1 GB RAM
    memswap_limit: 640m    # allows 128 MB swap burst for startup spikes
    volumes:
      - ./data:/app/data                      # SQLite DB persistence
      - ./uploads:/app/static/uploads         # Uploaded images & PDFs persistence
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
