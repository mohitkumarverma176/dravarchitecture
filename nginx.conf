# Drav Architecture — Nginx reverse proxy config
# Deploy: sudo cp nginx.conf /etc/nginx/sites-available/dravarchitecture
#         sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name dravarchitecture.co.in www.dravarchitecture.co.in 137.23.62.254;

    # Proxy all requests to Gunicorn (static files served by Flask)
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 30M;
    }
}
