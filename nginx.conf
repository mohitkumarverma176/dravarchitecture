# Drav Architecture — Nginx reverse proxy config
# Deploy: sudo cp nginx.conf /etc/nginx/sites-available/dravarchitecture
#         sudo ln -s /etc/nginx/sites-available/dravarchitecture /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# After DNS is live, run: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot will insert HTTPS redirect + SSL block automatically

    # Serve static assets directly — faster, no Flask overhead
    location /static/ {
        alias /opt/drav/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Proxy everything else to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 30M;  # match Flask MAX_CONTENT_LENGTH
    }
}
